[build]
  command = "npm run build"
  publish = "dist"

# ImageKit auth: same path as Vercel so one .env works
[[redirects]]
  from = "/api/imagekit-auth"
  to = "/.netlify/functions/imagekit-auth"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
